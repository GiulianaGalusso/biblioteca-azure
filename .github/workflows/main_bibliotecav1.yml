name: Desplegar biblioteca en Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: windows-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar página
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path sitio -Force
          Copy-Item index.html sitio/

      - name: Iniciar sesión en Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_7A60EFE2355347D098D1123002E92244 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_753BFB9455B447FA89B01D87E9E308B2 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_98FEAC19DE914432AB9CF3372C9F3B7F }}

      - name: Desplegar en Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: BibliotecaV1
          slot-name: Production
          package: ./sitio
